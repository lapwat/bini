[package]
name = "bini"
version = "0.1.13"
edition = "2024"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
dirs = "=6.0.0"
env_logger = "=0.11.11"
filetime = "=0.2.29"
flate2 = "=1.1.9"
log = "=0.4.33"
regex = "=1.13.1"
reqwest = { version = "=0.13.4", features = ["blocking", "json"] }
self-replace = "=1.5.0"
serde_json = "=1.0.151"
tar = "=0.4.46"
tempfile = "=3.27.0"
time = { version="=0.3.55", features = ["macros", "formatting", "parsing"] }
walkdir = "=2.5.0"
zip = "=8.6.0"
