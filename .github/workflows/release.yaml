name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        name: ${{ matrix.target }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                    - os: macos-latest
                      target: x86_64-apple-darwin

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Build release binary
              run: cargo build --release --target ${{ matrix.target }}

            - name: Pack archive (Linux / macOS)
              run: |
                  tar -czvf ${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release ${{ github.event.repository.name }}
                  sha256sum ${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > ${{ github.event.repository.name }}-${{ matrix.target }}.tar.gz.sha256

            - name: Upload to Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      ${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
                      ${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
